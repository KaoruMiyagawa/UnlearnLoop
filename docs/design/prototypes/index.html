<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UnlearnLoop · 交互式视觉原型</title>
<style>
:root{--bg:#f6f8fb;--panel:#fff;--ink:#1f2937;--muted:#667085;--line:#e3e8ef;--blue:#2563eb;--soft:#eaf1ff;--green:#15803d;--amber:#b45309;--red:#b42318;--shadow:0 12px 36px #1f293714}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,textarea{font:inherit}button{cursor:pointer}.top{height:68px;padding:0 32px;display:flex;align-items:center;gap:28px;background:#fffffff2;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}.brand{font-weight:750;display:flex;gap:10px;align-items:center}.mark{display:grid;place-items:center;width:30px;height:30px;background:var(--blue);color:#fff;border-radius:9px;font-size:12px}.nav{display:flex;align-items:stretch;height:100%;gap:3px}.nav button,.work button,.scheme button{border:0;background:transparent;color:var(--muted)}.nav button{padding:0 13px;border-bottom:2px solid transparent}.nav button.active,.work button.active{color:var(--ink);border-bottom-color:var(--blue);font-weight:650}.user{margin-left:auto;color:var(--muted);font-size:13px}.stage{width:min(1220px,calc(100% - 44px));margin:auto;padding:32px 0 54px}.intro{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:20px}.eyebrow{color:var(--blue);font-size:12px;font-weight:750;letter-spacing:.09em;text-transform:uppercase;margin-bottom:7px}h1{font-size:30px;line-height:1.2;letter-spacing:-.035em;margin:0 0 8px}h2{font-size:21px;line-height:1.3;margin:0 0 7px}h3{font-size:16px;margin:0 0 8px}.lede,.muted{color:var(--muted)}.lede{margin:0}.scheme{padding:5px;background:#fff;border:1px solid var(--line);border-radius:12px;display:flex;gap:5px}.scheme button{padding:9px 12px;border-radius:8px;font-weight:650;white-space:nowrap}.scheme button.active{color:var(--blue);background:var(--soft)}.notice{padding:12px 15px;border:1px solid #d6e3ff;border-radius:10px;background:#f0f5ff;color:#35507b;margin-bottom:18px}.work{display:flex;gap:5px;border-bottom:1px solid var(--line);margin-bottom:20px}.work button{padding:11px 15px;border-bottom:2px solid transparent;font-weight:650}.grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(270px,.85fr);gap:20px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.pad{padding:23px}.head{padding:19px 21px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:14px}.body{padding:20px 21px}.small{color:var(--muted);font-size:13px}.tag{display:inline-block;border-radius:99px;padding:4px 9px;background:#f0f2f5;color:#475467;font-size:12px;font-weight:650}.blue{background:var(--soft);color:#2452a6}.green{background:#eaf8ef;color:var(--green)}.amber{background:#fff6df;color:var(--amber)}.red{background:#fff0ef;color:var(--red)}.purple{background:#f1edff;color:#6941c6}.btn{border:1px solid var(--line);border-radius:9px;padding:9px 13px;background:#fff;color:var(--ink);font-weight:650}.btn.primary{border-color:var(--blue);background:var(--blue);color:#fff}.btn:hover{transform:translateY(-1px);border-color:#aebbd0}.btn-row{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:20px}.stat{padding:13px;border:1px solid var(--line);border-radius:10px;background:#fbfcfe}.stat strong{font-size:22px;display:block}.list{display:grid;gap:9px}.item{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #edf0f4}.item:last-child{border:0}.callout{padding:14px;border-radius:10px;background:#f8fafc;border:1px solid var(--line)}.callout.blue{background:var(--soft);border-color:#d3e1ff}.callout.amber{background:#fff6df;border-color:#f4dfaa}.callout.green{background:#eaf8ef;border-color:#c7e9d1}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.code{overflow:auto;border-radius:10px;background:#182235;color:#d9e4f5}.code-top{padding:7px 11px;color:#9aacc6;border-bottom:1px solid #2c3b54;font-size:12px}pre{margin:0;padding:15px;font:13px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace}.question{padding:17px;margin-top:15px;border:1px solid #dce5f1;border-radius:11px;background:#fbfdff}textarea{width:100%;min-height:120px;margin-top:12px;resize:vertical;padding:13px;border:1px solid #ccd5e1;border-radius:9px;color:var(--ink);font:14px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace}.feedback{display:none;margin-top:13px;padding:12px;border-radius:9px;background:#eaf8ef;border:1px solid #c7e9d1;color:#23683d}.feedback.show{display:block}.hyp{display:flex;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid #edf0f4}.hyp:last-child{border:0}.bar{width:70px;height:5px;margin-top:7px;background:#edf0f4;border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;background:#f59e0b}.evidence{display:grid;gap:9px;margin-top:13px;padding-left:15px;border-left:1px solid #d8e0ec}.evi{padding:10px 11px;border:1px solid var(--line);border-radius:9px}.steps{display:flex;gap:16px;margin-bottom:20px;overflow:auto}.step{color:#98a2b3;white-space:nowrap}.step.active{color:var(--ink);font-weight:650}.dot{display:inline-grid;place-items:center;width:23px;height:23px;margin-right:5px;border-radius:50%;background:#eef1f5;font-size:12px}.step.done .dot{background:var(--green);color:#fff}.step.active .dot{background:var(--blue);color:#fff}.foot{text-align:center;color:#98a2b3;font-size:12px;margin-top:27px}@media(max-width:850px){.top{padding:0 17px;gap:14px}.user{display:none}.grid{grid-template-columns:1fr}.intro{align-items:flex-start;flex-direction:column}}@media(max-width:580px){.top{height:auto;min-height:64px;flex-wrap:wrap;padding-top:11px}.nav{order:3;width:100%;height:39px;overflow:auto}.nav button{padding:0 8px}.stage{width:calc(100% - 28px);padding-top:23px}h1{font-size:25px}.pad,.body{padding:17px}.head{padding:17px}.stats,.split{grid-template-columns:1fr}}
</style></head><body>
<header class="top"><div class="brand"><span class="mark">UL</span><span>UnlearnLoop</span></div><nav class="nav"><button class="active" data-nav="home">首页</button><button data-nav="learn">学习</button><button data-nav="diagnosis">诊断</button><button data-nav="review">复习</button></nav><div class="user">Python 基础路径 · 林</div></header>
<main class="stage"><section class="intro"><div><div class="eyebrow">Offline interactive prototype · v0.1</div><h1 id="title">把错误变成下一步</h1><p class="lede" id="desc">选择一种视觉方案，浏览同一套学习闭环如何被组织和表达。</p></div><div class="scheme"><button class="active" data-scheme="A">A · 错误侦查室</button><button data-scheme="B">B · 任务引导式</button><button data-scheme="C">C · Python 工作台</button></div></section><div class="notice">● <strong>原型说明</strong>　<span id="notice">这是本地模拟数据。点击方案、工作空间和操作按钮，观察状态反馈。</span></div><nav class="work"><button class="active" data-space="home">学习主页</button><button data-space="learn">Python 学习任务</button><button data-space="diagnosis">错误诊断</button></nav><div id="view"></div><div class="foot">UnlearnLoop design exploration · no external assets · no network required</div></main>
<script>
const schemes={A:{t:'把错误变成下一步',d:'错误侦查室把候选原因、证据链与待验证假设放在同一张桌面上。',n:'优先查看“为什么这样判断”，再决定下一条最有价值的证据。',l:['侦查概览','取证任务','假设面板']},B:{t:'一步一步，知道为什么',d:'任务引导式学习把复杂的诊断过程拆成当前步骤、操作目的和下一步。',n:'每个动作都说明目的；完成当前步骤后，系统才打开下一步。',l:['今日任务','当前任务','下一步']},C:{t:'在代码里看见自己的思路',d:'沉浸式 Python 学习工作台让题目、代码文本和诊断反馈保持在同一上下文中。',n:'保持编码上下文，同时用轻量反馈指出需要验证的思路。',l:['工作台首页','代码任务','代码诊断']}};
let st={s:'A',w:'home',sent:false,n:''};const $=x=>document.querySelector(x);const code='total = 0;  for (i = 0; i < 3; i++) total += i;  print(total)';const side=(title,arr)=>'<aside class="card pad"><div class="eyebrow">'+title+'</div><div class="list">'+arr.map(x=>'<div class="item"><div><strong>'+x[0]+'</strong><div class="small">'+x[1]+'</div></div><span class="tag '+(x[2]||'')+'">'+(x[3]||'')+'</span></div>').join('')+'</div></aside>';const ev='<div class="evidence"><div class="evi"><strong>答案文本</strong><div class="small">“循环结束后，i 还是 3。”</div></div><div class="evi"><strong>追问回应</strong><div class="small">能写出结果，但无法解释每轮状态变化。</div></div><div class="evi"><strong>系统规则</strong><div class="small">结果与执行追踪存在一处不一致。</div></div></div>';
function home(){if(st.s==='A')return '<div class="grid"><section class="card pad"><div class="eyebrow">侦查室 · 今日概览</div><h2>先从一条未解决的线索开始</h2><p class="muted">你有 2 个错误假设等待更多证据。继续上次的循环任务，系统会从最能区分原因的问题开始。</p><div class="stats"><div class="stat"><strong>02</strong><span class="small">待验证假设</span></div><div class="stat"><strong>04</strong><span class="small">本周已收集证据</span></div><div class="stat"><strong>72%</strong><span class="small">Python 路径进度</span></div></div><div class="btn-row"><button class="btn primary" data-act="start">继续取证</button><button class="btn" data-jump="diagnosis">查看全部假设</button></div></section>'+side('线索队列',[['循环执行顺序','最近一次诊断 · 12 分钟前','amber','需要证据'],['函数参数传递','迁移验证失败 · 昨天','red','待复习'],['列表切片','已确认 · 3 天前','green','稳定']])+'</div>';if(st.s==='B')return '<div class="grid"><section class="card pad"><div class="eyebrow">今日学习路径</div><h2>完成一个 8 分钟的循环任务</h2><p class="muted">你已经完成“理解题目”。下一步是提交自己的解释，系统会据此判断是否需要追问。</p><div class="steps"><span class="step done"><span class="dot">✓</span>理解题目</span><span class="step active"><span class="dot">2</span>解释思路</span><span class="step"><span class="dot">3</span>验证掌握</span></div><div class="callout blue"><strong>当前步骤的目的</strong><p class="small">先让你独立说出循环如何变化，再决定要不要显示提示。</p></div><div class="btn-row"><button class="btn primary" data-act="start">开始当前步骤</button><button class="btn" data-jump="learn">查看任务</button></div></section>'+side('路径进度',[['循环与状态','第 2 / 3 步','blue','进行中'],['函数基础','已完成','green','完成'],['列表切片','明天复习','amber','计划中']])+'</div>';return '<div class="grid"><section class="card pad"><div class="eyebrow">Python 工作台</div><h2>把一次错误变成可复用的理解</h2><p class="muted">从最近的代码任务继续。题目、输入区和诊断反馈会在同一个工作台中逐步展开。</p><div class="code"><div class="code-top">lesson_03.py · 未运行</div><pre>'+code+'</pre></div><div class="btn-row"><button class="btn primary" data-act="start">打开工作台</button><button class="btn" data-jump="diagnosis">看诊断反馈</button></div></section>'+side('工作台状态',[['当前模块','循环与累加','blue','进行中'],['代码提交','上次保存 12 分钟前','green','已保存'],['诊断反馈','有 1 条建议','amber','待查看']])+'</div>'}
function learn(){return '<div class="grid"><section class="card"><div class="head"><div><div class="eyebrow">'+(st.s==='A'?'取证任务':st.s==='B'?'当前任务 · 第 2 步':'Code task · loop_03.py')+'</div><h2>'+(st.s==='B'?'先做一个预测':'你认为这段代码最后输出什么？')+'</h2><p class="small">先提交你的判断，错误不代表失败，它会成为诊断线索。</p></div><span class="tag blue">Python 3</span></div><div class="body">'+(st.s==='B'?'<div class="steps"><span class="step done"><span class="dot">✓</span>读题</span><span class="step active"><span class="dot">2</span>作答</span><span class="step"><span class="dot">3</span>解释</span></div>':'')+'<div class="code"><div class="code-top">question.py</div><pre>'+code+'</pre></div><div class="question"><strong>写下结果和你的理由</strong><textarea id="answer" placeholder="例如：我认为输出是 3，因为……">'+(st.sent?'我认为输出是 3，因为循环会把 0、1、2 加起来。':'')+'</textarea><div class="btn-row"><button class="btn primary" data-act="submit">提交线索</button><button class="btn" data-act="hint">我需要提示</button></div><div class="feedback '+(st.sent?'show':'')+'"><strong>线索已记录。</strong> 系统发现“结果判断”和“执行过程解释”之间还需要一条区分性证据。</div></div></div></section>'+side(st.s==='A'?'当前侦查目标':st.s==='B'?'学习路径':'诊断侧栏',st.s==='A'?[['只记得最终结果','置信度 46%','amber','待验证'],['误解 range 起点','置信度 31%','purple','待验证']]:st.s==='B'?[['1 · 读题','已完成','green','完成'],['2 · 作答','写下预测','blue','当前'],['3 · 解释','等待解锁','','未开始']]:[['结果预测','输出 3','green','匹配'],['执行解释','需要更多证据','amber','待诊断'],['迁移练习','尚未开始','','下一步']])+'</div>'}
function diagnosis(){return '<div class="grid"><section class="card"><div class="head"><div><div class="eyebrow">'+(st.s==='A'?'错误侦查室 · 当前案件 #014':st.s==='B'?'下一步为什么是这个？':'Feedback inspector')+'</div><h2>'+(st.s==='A'?'循环执行顺序仍有两个可能原因':st.s==='B'?'用一个小问题定位你的卡点':'结果正确，但思路需要一次验证')+'</h2><p class="small">系统没有把候选原因合并成一个结论，因为当前证据还不足以区分它们。</p></div><span class="tag amber">需要证据</span></div><div class="body">'+(st.s==='A'?'<h3>候选错误原因</h3><div class="hyp"><div><strong>只记得最终结果，没有追踪中间状态</strong><p class="small">结果可能答对，但解释无法说明每一轮的变化。</p><span class="tag amber">支持：答案文本</span></div><div><strong>46%</strong><div class="bar"><span style="width:46%"></span></div></div></div><div class="hyp"><div><strong>误解 range(3) 的起点</strong><p class="small">需要确认学习者是否认为循环从 1 开始。</p><span class="tag purple">缺失：执行追踪</span></div><div><strong>31%</strong><div class="bar"><span style="width:31%"></span></div></div></div>':'<div class="split"><div class="callout green"><strong>输出预测</strong><p style="font-size:24px;font-weight:750;margin:7px 0">3 <span class="small">· 匹配</span></p></div><div class="callout amber"><strong>执行模型</strong><p style="font-size:24px;font-weight:750;margin:7px 0">待确认</p></div></div>')+'<div class="callout blue" style="margin-top:18px"><strong>最有区分度的追问</strong><p>如果把 print(total) 放进循环，每一轮会打印什么？</p><button class="btn primary" data-act="question">回答这条追问</button></div></div></section><aside class="card pad"><div class="eyebrow">证据时间线</div>'+ev+'<div class="btn-row"><button class="btn" data-act="resolve">标记为待确认</button><button class="btn" data-jump="home">返回主页</button></div></aside></div>'}
function render(){let x=schemes[st.s];$('#title').textContent=x.t;$('#desc').textContent=x.d;$('#notice').textContent=st.n||x.n;document.querySelectorAll('[data-scheme]').forEach(b=>b.classList.toggle('active',b.dataset.scheme===st.s));document.querySelectorAll('[data-space]').forEach((b,i)=>{b.classList.toggle('active',b.dataset.space===st.w);b.textContent=x.l[i]});$('#view').innerHTML=st.w==='home'?home():st.w==='learn'?learn():diagnosis();bind()}
function bind(){document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{let a=b.dataset.act;if(a==='start')st.w='learn';if(a==='submit')st.sent=true;if(a==='question'){st.w='diagnosis';st.n='追问已回答：0、1、3。系统将把“能追踪状态”加入证据。'}if(a==='hint')st.n='提示：先写出第一次进入循环前 total 的初始值。';if(a==='resolve')st.n='已标记为待确认，稍后会进入复习队列。';render()});document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{st.w=b.dataset.jump;render()})}
document.querySelectorAll('[data-scheme]').forEach(b=>b.onclick=()=>{st.s=b.dataset.scheme;st.w='home';st.sent=false;st.n='';render()});document.querySelectorAll('[data-space]').forEach(b=>b.onclick=()=>{st.w=b.dataset.space;render()});document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{st.w=b.dataset.nav==='review'?'home':b.dataset.nav;document.querySelectorAll('[data-nav]').forEach(x=>x.classList.toggle('active',x===b));render()});render();
</script><script>
// Default to the recommended, subject-agnostic guided workflow.
schemes.C.t='在知识内容里看见自己的思路';schemes.C.d='沉浸式知识学习工作台让题目、材料、答案和诊断反馈保持在同一上下文中。';schemes.C.l=['工作台首页','知识任务','知识诊断'];st.s='B';st.w='home';st.sent=false;st.n='';render();
document.querySelector('.user').textContent='综合知识路径 · 林';
document.querySelector('[data-nav="review"]').textContent='复习计划';
document.querySelector('.foot').textContent='UnlearnLoop · subject-agnostic guided learning · no external assets · no network required';
const walker=document.createTreeWalker(document.querySelector('#view'),NodeFilter.SHOW_TEXT);const replacements=[['循环任务','知识任务'],['循环与状态','概念与应用'],['循环与累加','当前知识主题'],['列表切片','下一知识主题']];let node;while(node=walker.nextNode()){replacements.forEach(([a,b])=>{node.data=node.data.replaceAll(a,b)})}
</script></body></html>
