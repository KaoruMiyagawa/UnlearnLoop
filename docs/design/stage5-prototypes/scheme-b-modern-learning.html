<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UnlearnLoop · 方案 B：现代学习产品型 (Modern Learning Product)</title>
  <style>
    :root {
      --surface-page: #F4F6FA;
      --surface-raised: #FFFFFF;
      --surface-subtle: #EDF1F7;
      --surface-rail: #0F172A;
      --text-primary: #0F172A;
      --text-secondary: #475569;
      --text-muted: #64748B;
      --border-default: #E2E8F0;
      --border-strong: #CBD5E1;
      --action-primary: #2563EB;
      --action-primary-hover: #1D4ED8;
      --action-soft: #EFF6FF;
      --success: #059669;
      --success-soft: #ECFDF5;
      --warning: #D97706;
      --warning-soft: #FFFBEB;
      --danger: #E11D48;
      --danger-soft: #FFF1F2;
      --purple: #7C3AED;
      --purple-soft: #F5F3FF;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.06);
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, "JetBrains Mono", Consolas, monospace;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--surface-page);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 14.5px;
      line-height: 1.55;
      display: grid;
      grid-template-columns: 232px minmax(0, 1fr);
      min-height: 100vh;
    }

    /* Left Product Navigation Rail */
    .sidebar {
      background: var(--surface-rail);
      color: #F8FAFC;
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: sticky;
      top: 0;
      height: 100vh;
    }
    .brand-box {
      padding: 4px 10px 18px;
      border-bottom: 1px solid #1E293B;
      margin-bottom: 16px;
    }
    .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 16px;
      color: #FFFFFF;
      text-decoration: none;
    }
    .brand-icon {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background: var(--action-primary);
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 800;
    }
    .scheme-sub {
      font-size: 11px;
      color: #94A3B8;
      margin-top: 6px;
      display: block;
    }
    .rail-nav {
      display: grid;
      gap: 4px;
    }
    .rail-btn {
      appearance: none;
      border: none;
      background: transparent;
      color: #94A3B8;
      padding: 10px 12px;
      border-radius: 8px;
      text-align: left;
      font: inherit;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.15s ease;
    }
    .rail-btn:hover {
      background: #1E293B;
      color: #F8FAFC;
    }
    .rail-btn.active {
      background: var(--action-primary);
      color: #FFFFFF;
      font-weight: 600;
    }
    .rail-badge {
      font-size: 11px;
      padding: 1px 7px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.14);
      color: #E2E8F0;
    }
    .rail-footer {
      padding: 12px 10px;
      border-top: 1px solid #1E293B;
      font-size: 12px;
      color: #94A3B8;
    }
    .rail-footer a {
      color: #60A5FA;
      text-decoration: none;
      display: inline-block;
      margin-top: 6px;
      font-weight: 600;
    }

    /* Main Content Area */
    .main-shell {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    /* Top Context & Closed-Loop Stepper Header */
    .top-header {
      background: var(--surface-raised);
      border-bottom: 1px solid var(--border-default);
      padding: 12px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 15;
    }
    .stepper-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .step-pill {
      appearance: none;
      border: 1px solid var(--border-default);
      background: var(--surface-page);
      color: var(--text-secondary);
      padding: 5px 11px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .step-pill:hover {
      border-color: var(--action-primary);
      color: var(--action-primary);
    }
    .step-pill.active {
      background: var(--action-primary);
      border-color: var(--action-primary);
      color: #FFFFFF;
    }
    .step-pill.done {
      background: var(--success-soft);
      border-color: #A7F3D0;
      color: var(--success);
    }

    .workspace-body {
      padding: 24px 28px 64px;
      max-width: 1380px;
      width: 100%;
      margin: 0 auto;
    }

    /* Split-Pane Workbench Grid */
    .workbench-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.55fr) minmax(340px, 0.95fr);
      gap: 20px;
      align-items: start;
    }

    .card {
      background: var(--surface-raised);
      border: 1px solid var(--border-default);
      border-radius: 12px;
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      margin-bottom: 18px;
    }
    .card-head {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-default);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #FAFBFD;
    }
    .card-title {
      font-size: 15px;
      font-weight: 650;
      margin: 0;
    }
    .card-body {
      padding: 20px;
    }

    /* Status Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 99px;
      border: 1px solid transparent;
    }
    .badge.blue { background: var(--action-soft); color: var(--action-primary); border-color: #BFDBFE; }
    .badge.green { background: var(--success-soft); color: var(--success); border-color: #A7F3D0; }
    .badge.amber { background: var(--warning-soft); color: var(--warning); border-color: #FDE68A; }
    .badge.red { background: var(--danger-soft); color: var(--danger); border-color: #FECDD3; }
    .badge.purple { background: var(--purple-soft); color: var(--purple); border-color: #DDD6FE; }
    .badge.slate { background: var(--surface-subtle); color: var(--text-secondary); border-color: var(--border-strong); }

    /* Code Block */
    .code-box {
      background: #0F172A;
      color: #E2E8F0;
      border-radius: 8px;
      overflow: hidden;
      margin: 12px 0;
    }
    .code-box-head {
      padding: 7px 14px;
      background: #1E293B;
      color: #94A3B8;
      font-family: var(--font-mono);
      font-size: 11.5px;
      display: flex;
      justify-content: space-between;
    }
    .code-box pre {
      margin: 0;
      padding: 14px;
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.65;
    }

    textarea.modern-input {
      width: 100%;
      min-height: 104px;
      padding: 12px 14px;
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      font-family: var(--font-mono);
      font-size: 13.5px;
      line-height: 1.55;
      color: var(--text-primary);
      background: #FCFDFE;
    }
    textarea.modern-input:focus {
      outline: 2px solid var(--action-primary);
      border-color: transparent;
    }

    .btn-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }
    .btn {
      appearance: none;
      border: 1px solid var(--border-strong);
      background: var(--surface-raised);
      color: var(--text-primary);
      padding: 8px 15px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn:hover {
      background: var(--surface-subtle);
    }
    .btn.primary {
      background: var(--action-primary);
      border-color: var(--action-primary);
      color: #FFFFFF;
    }
    .btn.primary:hover {
      background: var(--action-primary-hover);
    }

    /* Hypothesis Progress Card */
    .hyp-card {
      border: 1px solid var(--border-default);
      border-radius: 9px;
      padding: 13px 14px;
      margin-bottom: 10px;
      background: #FCFDFE;
    }
    .hyp-bar-track {
      height: 6px;
      background: var(--surface-subtle);
      border-radius: 99px;
      overflow: hidden;
      margin: 8px 0;
    }
    .hyp-bar-fill {
      height: 100%;
      border-radius: 99px;
      transition: width 0.3s ease;
    }

    .ev-pill-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
      font-size: 12.5px;
    }
    .ev-entry {
      padding: 6px 10px;
      border-radius: 6px;
      background: var(--surface-page);
      border-left: 3px solid var(--border-strong);
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }
    .ev-entry.sup { border-left-color: var(--success); background: var(--success-soft); }
    .ev-entry.con { border-left-color: var(--danger); background: var(--danger-soft); }
    .ev-entry.mis { border-left-color: var(--warning); background: var(--warning-soft); }

    .kpi-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 20px;
    }
    .kpi-box {
      background: var(--surface-raised);
      border: 1px solid var(--border-default);
      border-radius: 10px;
      padding: 16px;
    }
    .kpi-val {
      font-size: 24px;
      font-weight: 700;
      margin-top: 4px;
    }

    @media (max-width: 1024px) {
      body { grid-template-columns: 1fr; }
      .sidebar { height: auto; position: static; }
      .workbench-grid { grid-template-columns: 1fr; }
      .kpi-row { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div>
      <div class="brand-box">
        <a class="brand-logo" href="./index.html">
          <span class="brand-icon">UL</span>
          <span>UnlearnLoop</span>
        </a>
        <span class="scheme-sub">方案 B · 现代学习产品型工作台</span>
      </div>
      <nav class="rail-nav" aria-label="产品侧边栏导航">
        <button class="rail-btn active" data-view="home"><span>学习焦点总览</span><span class="rail-badge">今日</span></button>
        <button class="rail-btn" data-view="workspace"><span>双栏学习工作台</span><span class="rail-badge">进行中</span></button>
        <button class="rail-btn" data-view="diagnosis"><span>Agent 诊断检视器</span><span class="rail-badge">2 假设</span></button>
        <button class="rail-btn" data-view="transfer"><span>变式迁移验证室</span><span class="rail-badge">防刷分</span></button>
        <button class="rail-btn" data-view="progress"><span>掌握状态与复习计划</span><span class="rail-badge">5 主题</span></button>
      </nav>
    </div>
    <div class="rail-footer">
      <div><strong>[MOCK DATA · 审美评审]</strong></div>
      <div>三栏高密度结构：左轨导航 + 顶部闭环进度条 + 主操作区与实时证据侧栏。</div>
      <a href="./index.html">← 返回三方案对比总览</a>
    </div>
  </aside>

  <div class="main-shell">
    <header class="top-header">
      <div class="stepper-bar" aria-label="六步闭环进度">
        <span style="font-size:12px;font-weight:700;color:var(--text-muted);margin-right:4px;">学习闭环阶段联动：</span>
        <button class="step-pill done" onclick="jumpLoopStep(1)">1. 初始作答 ("3")</button>
        <button class="step-pill active" id="st-btn-2" onclick="jumpLoopStep(2)">2. 竞争假设 & 证据不足</button>
        <button class="step-pill" id="st-btn-3" onclick="jumpLoopStep(3)">3. 区分性追问 ("1、3")</button>
        <button class="step-pill" id="st-btn-4" onclick="jumpLoopStep(4)">4. 针对性干预 & 练习</button>
        <button class="step-pill" id="st-btn-5" onclick="jumpLoopStep(5)">5. 迁移失败 & 同题拦截</button>
        <button class="step-pill" id="st-btn-6" onclick="jumpLoopStep(6)">6. 独立新题掌握 (stable)</button>
      </div>
      <div>
        <span class="badge slate">引擎模式：Demo / Mock (<code>FakeModelProvider</code>)</span>
      </div>
    </header>

    <main class="workspace-body" id="b-root"></main>
  </div>

  <script>
    const state = {
      view: 'workspace',
      loopStep: 2 // 1..6 interactive synchronized state across main pane & inspector rail
    };

    const stepConfigs = {

    function setView(v) {
      state.view = v;
      document.querySelectorAll('.rail-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.view === v);
      });

    }

    function jumpLoopStep(step) {
      state.loopStep = step;
      if (state.view === 'home' || state.view === 'progress') {
        state.view = 'workspace';
        document.querySelectorAll('.rail-btn').forEach(b => {
          b.classList.toggle('active', b.dataset.view === 'workspace');
        });
      }
      render();
    }

    function render() {
      // Update top stepper buttons
      for (let i = 1; i <= 6; i++) {
        const pills = document.querySelectorAll('.step-pill');
        if (pills[i - 1]) {
          pills[i - 1].className = 'step-pill' + (i === state.loopStep ? ' active' : i < state.loopStep ? ' done' : '');
        }
      }
      const root = document.getElementById('b-root');
      if (state.view === 'home') root.innerHTML = renderHome();
      else if (state.view === 'workspace' || state.view === 'diagnosis') root.innerHTML = renderWorkspaceOrDiagnosis();
      else if (state.view === 'transfer') root.innerHTML = renderTransfer();
      else root.innerHTML = renderProgress();
    }

    document.querySelectorAll('.rail-btn').forEach(btn => {
      btn.addEventListener('click', () => setView(btn.dataset.view));
    });

    render();
